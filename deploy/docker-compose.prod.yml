# Single-server production stack for SimplexD.
#
#   cp deploy/.env.production.example .env.production   # fill in secrets
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production build
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production run --rm migrate
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d
#
# Profiles:
#   storage  - runs MinIO on this server (otherwise point S3_* at managed storage)
#   scanner  - runs ClamAV for upload scanning
#   ops      - one-off commands (migrate, seed, bootstrap-admin, check-rls, backup)
name: simplexd

x-app-env: &app-env
  env_file:
    - ${ENV_FILE:-../.env.production}
  environment:
    APP_ENV: production
    DATABASE_URL: postgres://simplexd_app:${SIMPLEXD_APP_PASSWORD}@db:5432/${POSTGRES_DB:-simplexd}
    MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-simplexd_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-simplexd}
    REDIS_URL: redis://redis:6379

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplexd_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-simplexd}
      SIMPLEXD_APP_PASSWORD: ${SIMPLEXD_APP_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
      - -c
      - max_wal_senders=3
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-simplexd_owner} -d ${POSTGRES_DB:-simplexd}']
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    image: ${WEB_IMAGE:-simplexd-web:latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    image: ${WORKER_IMAGE:-simplexd-worker:latest}
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3100'
    deploy:
      resources:
        limits:
          memory: 768m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  migrate:
    image: ${WORKER_IMAGE:-simplexd-worker:latest}
    profiles: ['ops']
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    command: ['node', 'dist/cli/migrate.js']

  seed:
    image: ${WORKER_IMAGE:-simplexd-worker:latest}
    profiles: ['ops']
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    command: ['node', 'dist/cli/seed.js']

  bootstrap-admin:
    image: ${WORKER_IMAGE:-simplexd-worker:latest}
    profiles: ['ops']
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['node', 'dist/cli/bootstrap-admin.js']

  check-rls:
    image: ${WORKER_IMAGE:-simplexd-worker:latest}
    profiles: ['ops']
    <<: *app-env
    command: ['node', 'dist/cli/check-rls.js']

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ['storage']
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-simplexd}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    expose:
      - '9000'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 12

  clamav:
    image: clamav/clamav:1.4
    profiles: ['scanner']
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    expose:
      - '3310'

volumes:
  db-data:
  redis-data:
  caddy-data:
  caddy-config:
  minio-data:
  clamav-data:
