<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="t">
  <title id="t">Illustration of two clocks in different time zones linked by an approval message</title>
  <rect x="24" y="24" width="592" height="432" rx="16" fill="#c8a04b" fill-opacity="0.08"/>
  <g transform="translate(180 220)">
    <circle r="88" fill="#ffffff" fill-opacity="0.8" stroke="#1f5f4b" stroke-width="4"/>
    <path d="M0 -60 V0 L38 22" fill="none" stroke="#1f5f4b" stroke-width="6" stroke-linecap="round"/>
    <circle r="6" fill="#1f5f4b"/>
    <text y="124" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1f5f4b" text-anchor="middle">Africa/Lagos · 14:00</text>
  </g>
  <g transform="translate(460 220)">
    <circle r="88" fill="#ffffff" fill-opacity="0.8" stroke="#1f7a8c" stroke-width="4"/>
    <path d="M0 -60 V0 L-44 -18" fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round"/>
    <circle r="6" fill="#1f7a8c"/>
    <text y="124" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1f7a8c" text-anchor="middle">Your zone · shown alongside</text>
  </g>
  <path d="M268 220 H372" stroke="#c8a04b" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
  <g transform="translate(320 150)">
    <rect x="-76" y="-30" width="152" height="60" rx="10" fill="#1f5f4b"/>
    <path d="M-20 0 l12 12 l28 -28" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="5" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">approved</text>
  </g>
</svg>
